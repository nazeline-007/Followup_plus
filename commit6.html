<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FollowUp+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<div class="container mx-auto max-w-3xl px-4 py-10">
  <h1 class="text-4xl font-bold text-indigo-900 text-center">FollowUp+</h1>

  <div class="bg-white p-6 rounded-lg shadow mt-8">
    <button onclick="summary()" class="bg-purple-600 text-white px-4 py-2 rounded">
      Generate Doctor Summary
    </button>
    <pre id="result" class="mt-4 whitespace-pre-wrap"></pre>
  </div>
</div>

<script>
function summary() {
  result.innerText = `
Doctor Summary:
- Patient following lifestyle plan
- Consistent daily adherence
- Recommend continued monitoring
`;
}
</script>

</body>
</html>
