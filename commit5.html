<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FollowUp+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<div class="container mx-auto max-w-3xl px-4 py-10">
  <h1 class="text-4xl font-bold text-indigo-900 text-center">FollowUp+</h1>

  <div class="bg-white p-6 rounded-lg shadow mt-8">
    <label class="flex items-center gap-2">
      <input type="checkbox" id="check">
      Did I follow today's plan?
    </label>

    <p id="progress" class="mt-4 text-gray-700"></p>
  </div>
</div>

<script>
let total = 0, followed = 0;

check.onchange = () => {
  total++;
  if (check.checked) followed++;
  progress.innerText = `Progress: ${Math.round((followed/total)*100)}%`;
};
</script>

</body>
</html>
